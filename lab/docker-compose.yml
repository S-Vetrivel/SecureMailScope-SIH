version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - HTTP_PORT=8080
      - DB_PATH=/app/data/securemailscope.db
      - UPLOAD_DIR=/app/data/uploads
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - backend-data:/app/data

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1

volumes:
  backend-data:
